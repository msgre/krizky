[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krizky"
version = "0.1.0"
description = "Universal static site generator from Google Sheets, Docs and Drive photos"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
    "pluggy>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlite-utils>=3.39",
    "markdown-it-py>=3.0",
]

[project.scripts]
krizky = "krizky.cli:cli"

[project.optional-dependencies]
# photos = ["krizky-photos"]  # uncomment after krizky-photos is published on PyPI
dev = [
    "pytest",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["krizky"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "__pycache__", ".pytest_cache", "tests/fixtures", ".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins
    "C4",   # comprehensions
    "SIM",  # simplify
    "PT",   # pytest style
    "RUF",  # ruff-specific
    "FA",   # future-annotations
    "TID",  # tidy-imports (banned-api níže)
]
ignore = [
    "E501",  # line-too-long — řídí line-length
]
allowed-confusables = ["×"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.12+ ho nepotřebuje; viz docs/guidelines/python.md"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
